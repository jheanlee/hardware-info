[package]
name = "hardware-info"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Jhe-An Lee <jheanlee2008@gmail.com>"]
description = "A Library to fetch hardware information"
repository = "https://github.com/jheanlee/hardware-info"
license = "Apache-2.0"
keywords = ["hardware"]
categories = ["hardware-support", "os"]

[lib]
name = "hardware_info"

[features]
default = ["pci"]
pci = [
    "dep:objc2-core-foundation",
    "objc2-core-foundation/CFDictionary",
    "objc2-core-foundation/CFNumber",
    "objc2-core-foundation/CFString",
    "dep:objc2-io-kit",
]
debug = ["libc/extra_traits"]
# This feature is used on CI to simulate unknown/unsupported target.
unknown-ci = []

[dependencies]
[target.'cfg(not(target_os = "unknown"))'.dependencies]
libc = "^0.2.173"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
] }
objc2-io-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "libc",
] }